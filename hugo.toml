baseURL = 'https://nivel-cero.github.io/'
locale = 'es'
defaultContentLanguage = 'es'
title = 'Nivel Cero'
copyright = 'Texto bajo licencia [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.es)'
theme = 'hugo-book'

# no tag or category pages
disableKinds = ['taxonomy', 'term']

# the review date is the one that counts, also for the sitemap
[frontmatter]
  lastmod = ['reviewed', ':default']

[markup.goldmark.renderer]
  # no raw html inside the markdown
  unsafe = false

[params]
  BookTheme = 'auto'
  BookSection = '/'
  BookSearch = true
  # build fails on a broken link between pages
  BookPortableLinks = 'error'

# no third-party embeds, even if a page asks for one
[privacy.disqus]
  disable = true
[privacy.googleAnalytics]
  disable = true
[privacy.instagram]
  disable = true
[privacy.vimeo]
  disable = true
[privacy.x]
  disable = true
[privacy.youtube]
  disable = true
